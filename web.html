<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARZDROP</title>
    <style>
        /* ========== КИСЛОТНЫЙ ЧЁРНО-ЗЕЛЁНЫЙ СТИЛЬ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }

        /* ========== ОБЩИЕ КОМПОНЕНТЫ ========== */
        .container {
            max-width: 600px;
            width: 100%;
            padding: 10px 15px 30px;
        }

        .card {
            background: #111;
            border: 1px solid #00ff41;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.05);
            transition: all 0.2s;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff41;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
            margin-top: 6px;
        }

        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-danger {
            border-color: #ff0040;
            color: #ff0040;
        }
        .btn-danger:hover {
            background: #ff0040;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.3);
        }

        .btn-success {
            border-color: #00ff41;
            color: #00ff41;
        }
        .btn-success:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .flex-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex-row .btn {
            flex: 1;
            min-width: 80px;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 16px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            margin-bottom: 14px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            letter-spacing: 3px;
        }

        .balance {
            background: #111;
            border: 1px solid #00ff41;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 14px;
            color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .balance span {
            font-weight: bold;
            font-size: 16px;
        }

        /* ========== МЕНЮ ========== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .menu-item {
            background: #111;
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 8px;
            padding: 10px 4px;
            text-align: center;
            font-size: 11px;
            color: #00ff41;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .menu-item:hover {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .menu-item:active {
            transform: scale(0.94);
        }

        .menu-item .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }

        /* ========== СТРАНИЦЫ ========== */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ========== КЕЙСЫ ========== */
        .case-item {
            background: #111;
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .case-item .info {
            font-size: 13px;
        }

        .case-item .info .name {
            font-weight: bold;
            font-size: 15px;
        }

        .case-item .info .price {
            color: #888;
            font-size: 12px;
        }

        .case-item .btn {
            width: auto;
            padding: 6px 16px;
            font-size: 12px;
            margin: 0;
        }

        /* ========== АНИМАЦИЯ ОТКРЫТИЯ КЕЙСА ========== */
        #case-animation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #case-animation.show {
            display: flex;
        }

        .fly-item {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00ff41;
            text-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
            white-space: nowrap;
            background: rgba(0, 255, 65, 0.05);
            padding: 6px 14px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 8px;
            animation: flyAcross 6s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        @keyframes flyAcross {
            0% {
                transform: translateX(120vw) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            70% {
                transform: translateX(-20vw) scale(1.2) rotate(720deg);
                opacity: 1;
            }
            85% {
                transform: translateX(-10vw) scale(1.1) rotate(900deg);
                opacity: 0.9;
            }
            100% {
                transform: translateX(0) scale(1) rotate(1080deg);
                opacity: 1;
            }
        }

        .fly-item.winner {
            animation: none;
            position: relative;
            transform: scale(1.4);
            color: #ffd700;
            border-color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.2);
            font-size: 32px;
            padding: 16px 30px;
            background: rgba(255, 215, 0, 0.1);
        }

        .case-result-text {
            position: absolute;
            bottom: 30px;
            font-size: 18px;
            color: #00ff41;
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            animation: blink 0.5s ease-in-out 5;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ========== АПГРЕЙД ========== */
        .upgrade-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
        }

        .upgrade-slot {
            background: #111;
            border: 2px dashed rgba(0, 255, 65, 0.3);
            border-radius: 10px;
            padding: 12px 8px;
            min-width: 80px;
            flex: 1;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            transition: all 0.3s;
        }

        .upgrade-slot.active {
            border-color: #00ff41;
            border-style: solid;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .upgrade-slot .skin-name {
            font-weight: bold;
            font-size: 13px;
        }

        .upgrade-slot .skin-price {
            color: #888;
            font-size: 11px;
        }

        /* ========== КОЛЕСО (Canvas) ========== */
        #wheel-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #wheel-container.show {
            display: flex;
        }

        #wheel-canvas {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 255, 65, 0.15);
        }

        .wheel-result {
            margin-top: 18px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .wheel-result.win {
            color: #00ff41;
        }
        .wheel-result.lose {
            color: #ff0040;
        }

        /* ========== ИНВЕНТАРЬ ========== */
        .inv-item {
            background: #111;
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .inv-item .name {
            font-weight: bold;
        }

        .inv-item .price {
            color: #888;
            font-size: 12px;
        }

        /* ========== ПРОФИЛЬ ========== */
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
        }

        .profile-row .label {
            color: #888;
        }

        .profile-row .value {
            color: #00ff41;
            font-weight: bold;
        }

        /* ========== ТОП ========== */
        .top-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
            font-size: 13px;
        }

        .top-item .place {
            font-weight: bold;
            min-width: 30px;
            color: #888;
        }

        .top-item .place.gold {
            color: #ffd700;
        }
        .top-item .place.silver {
            color: #c0c0c0;
        }
        .top-item .place.bronze {
            color: #cd7f32;
        }

        .top-item .name {
            flex: 1;
        }

        .top-item .balance {
            font-weight: bold;
            font-size: 13px;
            padding: 2px 10px;
        }

        /* ========== ПОДПИСКА ========== */
        .sub-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
        }

        .sub-item .status {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .sub-item .status.done {
            color: #00ff41;
            border: 1px solid #00ff41;
        }

        .sub-item .status.pending {
            color: #ff0040;
            border: 1px solid #ff0040;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 480px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }
            .menu-item {
                font-size: 9px;
                padding: 8px 2px;
            }
            .menu-item .icon {
                font-size: 18px;
            }
            #wheel-canvas {
                width: 240px;
                height: 240px;
            }
            .fly-item {
                font-size: 18px;
                padding: 4px 10px;
            }
            .fly-item.winner {
                font-size: 22px;
                padding: 12px 20px;
            }
        }

        @media (min-width: 768px) {
            #wheel-canvas {
                width: 400px;
                height: 400px;
            }
        }

        /* ========== ЗАГРУЗКА ========== */
        .loading {
            color: #888;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .loading:after {
            content: '...';
            animation: dots 1s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .hidden {
            display: none !important;
        }

        /* ========== УВЕДОМЛЕНИЯ ========== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.15);
            max-width: 90%;
            text-align: center;
            animation: toastIn 0.3s ease-out;
        }

        .toast.error {
            border-color: #ff0040;
            color: #ff0040;
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.15);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- ШАПКА -->
        <div class="header">
            <div class="logo">⬡ ARZDROP</div>
            <div class="balance">💰 <span id="balance-display">0</span></div>
        </div>

        <!-- МЕНЮ -->
        <div class="menu-grid">
            <div class="menu-item" data-page="cases"><span class="icon">🎁</span>Кейсы</div>
            <div class="menu-item" data-page="inventory"><span class="icon">📦</span>Инвентарь</div>
            <div class="menu-item" data-page="profile"><span class="icon">👤</span>Профиль</div>
            <div class="menu-item" data-page="upgrade"><span class="icon">🔄</span>Апгрейд</div>
            <div class="menu-item" data-page="top"><span class="icon">🏆</span>Топ</div>
            <div class="menu-item" data-page="subscribe"><span class="icon">📢</span>Подписки</div>
        </div>

        <!-- ===== СТРАНИЦА: КЕЙСЫ ===== -->
        <div class="page active" id="page-cases">
            <div class="card">
                <div class="card-title">🎁 Кейсы</div>
                <div id="cases-list">
                    <div class="loading">Загрузка</div>
                </div>
            </div>
        </div>

        <!-- ===== СТРАНИЦА: ИНВЕНТАРЬ ===== -->
        <div class="page" id="page-inventory">
            <div class="card">
                <div class="card-title">📦 Инвентарь</div>
                <div id="inventory-list">
                    <div class="loading">Загрузка</div>
                </div>
            </div>
        </div>

        <!-- ===== СТРАНИЦА: ПРОФИЛЬ ===== -->
        <div class="page" id="page-profile">
            <div class="card">
                <div class="card-title">👤 Профиль</div>
                <div id="profile-content">
                    <div class="loading">Загрузка</div>
                </div>
            </div>
        </div>

        <!-- ===== СТРАНИЦА: АПГРЕЙД ===== -->
        <div class="page" id="page-upgrade">
            <div class="card">
                <div class="card-title">🔄 Апгрейд</div>
                <div id="upgrade-content">
                    <div class="upgrade-area">
                        <div class="upgrade-slot" id="upgrade-input">
                            <span style="font-size:12px; color:#666;">ВХОД</span>
                            <span style="font-size:11px; color:#444;">Выбери скин</span>
                        </div>
                        <div style="font-size:24px; color:#00ff41;">→</div>
                        <div class="upgrade-slot" id="upgrade-output">
                            <span style="font-size:12px; color:#666;">ВЫХОД</span>
                            <span style="font-size:11px; color:#444;">Выбери цель</span>
                        </div>
                    </div>
                    <button class="btn" id="upgrade-btn" disabled>Выбери вход</button>
                </div>
            </div>
        </div>

        <!-- ===== СТРАНИЦА: ТОП ===== -->
        <div class="page" id="page-top">
            <div class="card">
                <div class="card-title">🏆 Топ игроков</div>
                <div id="top-players"><div class="loading">Загрузка</div></div>
            </div>
            <div class="card">
                <div class="card-title">🏆 Топ кланов</div>
                <div id="top-clans"><div class="loading">Загрузка</div></div>
            </div>
        </div>

        <!-- ===== СТРАНИЦА: ПОДПИСКИ ===== -->
        <div class="page" id="page-subscribe">
            <div class="card">
                <div class="card-title">📢 Бонус за подписку</div>
                <div id="subscribe-content">
                    <div class="loading">Загрузка</div>
                </div>
            </div>
        </div>
    </div>

    <!-- АНИМАЦИЯ КЕЙСА (fullscreen) -->
    <div id="case-animation">
        <div id="case-items"></div>
        <div class="case-result-text" id="case-result-text"></div>
        <button class="btn" id="case-close-btn" style="position:absolute;bottom:100px;width:200px;left:50%;transform:translateX(-50%);display:none;">✕ Закрыть</button>
    </div>

    <!-- АНИМАЦИЯ АПГРЕЙДА (wheel) -->
    <div id="wheel-container">
        <canvas id="wheel-canvas" width="400" height="400"></canvas>
        <div class="wheel-result" id="wheel-result"></div>
    </div>

    <script>
        // ==================== КОНФИГ ====================
        const API_URL = window.location.origin || 'http://localhost:8000';
        let user_id = null;
        let balance = 0;
        let inventory = [];

        // ==================== ТЕЛЕГРАМ WEBAPP ====================
        function getTelegramUser() {
            if (window.Telegram && window.Telegram.WebApp) {
                const initData = window.Telegram.WebApp.initData;
                if (initData) {
                    return initData;
                }
            }
            // fallback для локальной разработки
            return null;
        }

        // ==================== АВТОРИЗАЦИЯ ====================
        async function auth() {
            const initData = getTelegramUser();
            if (!initData) {
                // Для локальной разработки — можно ввести ID вручную
                showToast('🔑 Режим разработки. Введи свой Telegram ID');
                const id = prompt('Введи свой Telegram ID:');
                if (id) {
                    user_id = parseInt(id);
                    await loadUserData();
                }
                return;
            }

            try {
                const resp = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });
                const data = await resp.json();
                if (data.user_id) {
                    user_id = data.user_id;
                    await loadUserData();
                } else {
                    showToast('❌ Ошибка авторизации', true);
                }
            } catch (e) {
                showToast('❌ Ошибка соединения', true);
            }
        }

        // ==================== ЗАГРУЗКА ДАННЫХ ====================
        async function loadUserData() {
            try {
                const resp = await fetch(`/api/profile/${user_id}`);
                const user = await resp.json();
                if (user) {
                    balance = user.balance || 0;
                    document.getElementById('balance-display').textContent = balance;
                }
                await loadInventory();
                await loadCases();
                await loadTop();
                await loadSubscribeStatus();
                renderProfile();
            } catch (e) {
                showToast('❌ Ошибка загрузки данных', true);
            }
        }

        async function loadInventory() {
            try {
                const resp = await fetch(`/api/inventory/${user_id}`);
                inventory = await resp.json();
                renderInventory();
            } catch (e) {
                document.getElementById('inventory-list').innerHTML = '❌ Ошибка загрузки';
            }
        }

        async function loadCases() {
            try {
                // Временно показываем статичные кейсы
                const cases = [
                    { name: 'БОМЖ', price: 500, desc: 'Для бедных' },
                    { name: 'DOLLAR', price: 1500, desc: 'Для богатых' }
                ];
                renderCases(cases);
            } catch (e) {
                document.getElementById('cases-list').innerHTML = '❌ Ошибка загрузки';
            }
        }

        async function loadTop() {
            try {
                const [players, clans] = await Promise.all([
                    fetch('/api/top_players').then(r => r.json()),
                    fetch('/api/top_clans').then(r => r.json())
                ]);
                renderTop(players, clans);
            } catch (e) {
                document.getElementById('top-players').innerHTML = '❌ Ошибка';
                document.getElementById('top-clans').innerHTML = '❌ Ошибка';
            }
        }

        async function loadSubscribeStatus() {
            // Временная заглушка
            document.getElementById('subscribe-content').innerHTML = `
                <div class="sub-item">
                    <span>🔗 ARZDROP CS2</span>
                    <span class="status pending">Не подписан</span>
                </div>
                <div class="sub-item">
                    <span>🔗 ARTStudio</span>
                    <span class="status pending">Не подписан</span>
                </div>
                <button class="btn" style="margin-top:12px;">🔄 Проверить</button>
            `;
        }

        // ==================== ОТРИСОВКА ====================
        function renderCases(cases) {
            const container = document.getElementById('cases-list');
            container.innerHTML = cases.map(c => `
                <div class="case-item">
                    <div class="info">
                        <div class="name">📦 ${c.name}</div>
                        <div class="price">${c.price} монет • ${c.desc}</div>
                    </div>
                    <button class="btn" onclick="openCase('${c.name}')">Открыть</button>
                </div>
            `).join('');
        }

        function renderInventory() {
            const container = document.getElementById('inventory-list');
            if (!inventory.length) {
                container.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">Инвентарь пуст</div>';
                return;
            }
            container.innerHTML = inventory.map(s => `
                <div class="inv-item">
                    <span class="name">${s.weapon} | ${s.name}</span>
                    <span class="price">${s.price_rub} монет</span>
                </div>
            `).join('');
        }

        function renderProfile() {
            const container = document.getElementById('profile-content');
            container.innerHTML = `
                <div class="profile-row"><span class="label">ID</span><span class="value">${user_id}</span></div>
                <div class="profile-row"><span class="label">Баланс</span><span class="value">${balance} монет</span></div>
                <div class="profile-row"><span class="label">Скинов</span><span class="value">${inventory.length}</span></div>
                <div class="profile-row"><span class="label">Открыто кейсов</span><span class="value">0</span></div>
                <div class="profile-row"><span class="label">XP</span><span class="value">0</span></div>
                <button class="btn" style="margin-top:12px;" onclick="showToast('🔗 Функция в разработке')">Привязать Steam</button>
            `;
        }

        function renderTop(players, clans) {
            const medals = ['🥇', '🥈', '🥉'];
            const container1 = document.getElementById('top-players');
            if (players.length === 0) {
                container1.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">Нет игроков</div>';
            } else {
                container1.innerHTML = players.map((p, i) => `
                    <div class="top-item">
                        <span class="place ${i < 3 ? ['gold','silver','bronze'][i] : ''}">${medals[i] || '#'+(i+1)}</span>
                        <span class="name">${p.name || 'User'}</span>
                        <span class="balance">💰 ${p.balance}</span>
                    </div>
                `).join('');
            }

            const container2 = document.getElementById('top-clans');
            if (clans.length === 0) {
                container2.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">Нет кланов</div>';
            } else {
                container2.innerHTML = clans.map((c, i) => `
                    <div class="top-item">
                        <span class="place ${i < 3 ? ['gold','silver','bronze'][i] : ''}">${medals[i] || '#'+(i+1)}</span>
                        <span class="name">${c.name} [${c.tag}]</span>
                        <span class="balance">👥 ${c.members}</span>
                    </div>
                `).join('');
            }
        }

        // ==================== ОТКРЫТИЕ КЕЙСА ====================
        async function openCase(caseName) {
            const anim = document.getElementById('case-animation');
            const itemsContainer = document.getElementById('case-items');
            const resultText = document.getElementById('case-result-text');
            const closeBtn = document.getElementById('case-close-btn');

            // Показываем анимацию
            anim.className = 'show';
            itemsContainer.innerHTML = '';
            resultText.textContent = '';
            closeBtn.style.display = 'none';

            // Запускаем открытие на сервере
            try {
                const resp = await fetch('/api/open_case', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': user_id
                    },
                    body: JSON.stringify({ case_name: caseName })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    showToast('❌ ' + (err.detail || 'Ошибка'), true);
                    anim.className = '';
                    return;
                }

                const result = await resp.json();

                // Показываем летящие предметы (20 штук)
                const dummyItems = [
                    'AK-47 | Redline', 'M4A4 | Howl', 'AWP | Dragon Lore',
                    'USP-S | Kill Confirmed', 'Glock-18 | Fade', 'Desert Eagle | Blaze',
                    'M4A1-S | Printstream', 'AK-47 | Fire Serpent', 'AWP | Medusa',
                    'P250 | Splash', 'Five-SeveN | Case Hardened', 'SSG 08 | Death Strike',
                    'MP9 | Rose Iron', 'MAC-10 | Stalker', 'Galil AR | Chatterbox',
                    'FAMAS | Eye of Athena', 'Nova | Antique', 'Sawed-Off | The Kraken',
                    'MAG-7 | Cobalt Core', 'G3SG1 | Victorious'
                ];

                for (let i = 0; i < 20; i++) {
                    const el = document.createElement('div');
                    el.className = 'fly-item';
                    el.textContent = dummyItems[i % dummyItems.length];
                    el.style.top = (10 + Math.random() * 70) + '%';
                    el.style.animationDelay = (i * 0.1) + 's';
                    el.style.fontSize = (18 + Math.random() * 16) + 'px';
                    itemsContainer.appendChild(el);
                }

                // Через 5.5 секунд показываем победителя
                setTimeout(() => {
                    // Убираем все летящие предметы
                    itemsContainer.querySelectorAll('.fly-item').forEach(el => el.remove());

                    // Показываем победителя
                    const win = document.createElement('div');
                    win.className = 'fly-item winner';
                    win.textContent = `${result.weapon} | ${result.name}`;
                    itemsContainer.appendChild(win);

                    resultText.textContent = `🎉 +${result.price_rub} монет!`;
                    resultText.style.color = '#ffd700';

                    // Обновляем баланс
                    balance = await fetch(`/api/profile/${user_id}`).then(r => r.json()).then(d => d.balance);
                    document.getElementById('balance-display').textContent = balance;

                    // Показываем кнопку закрытия
                    closeBtn.style.display = 'block';
                    closeBtn.onclick = () => {
                        anim.className = '';
                        loadInventory();
                    };
                }, 5500);

            } catch (e) {
                showToast('❌ Ошибка соединения', true);
                anim.className = '';
            }
        }

        // ==================== АПГРЕЙД (WHEEL) ====================
        let upgradeState = {
            input_inv_id: null,
            input_skin: null,
            target_skin: null
        };

        // Временные данные для демонстрации апгрейда
        const demoInventory = [
            { inv_id: 1, weapon: 'AK-47', name: 'Redline', price_rub: 5000 },
            { inv_id: 2, weapon: 'M4A4', name: 'Howl', price_rub: 8000 },
            { inv_id: 3, weapon: 'AWP', name: 'Dragon Lore', price_rub: 15000 },
        ];

        function renderUpgrade() {
            const container = document.getElementById('upgrade-content');
            if (inventory.length === 0) {
                container.innerHTML = `
                    <div style="color:#666;text-align:center;padding:20px;">Нет скинов для апгрейда</div>
                    <button class="btn" onclick="showToast('Открой кейс!')">Открыть кейс</button>
                `;
                return;
            }

            const eligible = inventory.filter(s => s.price_rub >= 1000);
            if (eligible.length === 0) {
                container.innerHTML = `
                    <div style="color:#666;text-align:center;padding:20px;">Нет скинов ≥ 1000 монет</div>
                    <button class="btn" onclick="showToast('Открой кейс!')">Открыть кейс</button>
                `;
                return;
            }

            let html = `
                <div style="margin-bottom:10px;font-size:12px;color:#666;">Выбери вход (скин ≥ 1000 монет)</div>
                <div style="display:flex;flex-direction:column;gap:6px;">
            `;

            eligible.slice(0, 10).forEach(s => {
                html += `
                    <button class="btn" style="font-size:12px;padding:8px;" onclick="selectUpgradeInput(${s.inv_id}, '${s.weapon}', '${s.name}', ${s.price_rub})">
                        ${s.weapon} | ${s.name} — ${s.price_rub} монет
                    </button>
                `;
            });

            html += `
                </div>
                <div class="upgrade-area" style="margin-top:12px;">
                    <div class="upgrade-slot ${upgradeState.input_skin ? 'active' : ''}" id="upgrade-input-display">
                        ${upgradeState.input_skin ? `${upgradeState.input_skin.weapon} | ${upgradeState.input_skin.name}` : 'ВХОД'}
                        ${upgradeState.input_skin ? `<span style="font-size:10px;color:#888;">${upgradeState.input_skin.price} монет</span>` : ''}
                    </div>
                    <div style="font-size:24px;color:#00ff41;">→</div>
                    <div class="upgrade-slot ${upgradeState.target_skin ? 'active' : ''}" id="upgrade-output-display">
                        ${upgradeState.target_skin ? `${upgradeState.target_skin.weapon} | ${upgradeState.target_skin.name}` : 'ВЫХОД'}
                        ${upgradeState.target_skin ? `<span style="font-size:10px;color:#888;">${upgradeState.target_skin.price} монет</span>` : ''}
                    </div>
                </div>
                <button class="btn ${upgradeState.input_skin && upgradeState.target_skin ? '' : 'btn-danger'}" 
                        ${upgradeState.input_skin && upgradeState.target_skin ? '' : 'disabled'}
                        onclick="startUpgrade()">
                    ${upgradeState.input_skin && upgradeState.target_skin ? '🔄 ЗАПУСТИТЬ АПГРЕЙД' : 'Выбери вход и выход'}
                </button>
                <button class="btn" style="margin-top:6px;font-size:11px;opacity:0.5;" onclick="resetUpgrade()">Сбросить</button>
            `;

            container.innerHTML = html;
        }

        function selectUpgradeInput(inv_id, weapon, name, price) {
            upgradeState.input_inv_id = inv_id;
            upgradeState.input_skin = { weapon, name, price };

            // Показываем доступные выходы (в 8 раз дороже)
            const maxPrice = price * 8;
            const targets = inventory
                .filter(s => s.price_rub > price && s.price_rub <= maxPrice)
                .slice(0, 10);

            if (targets.length === 0) {
                showToast('❌ Нет подходящих целей для этого скина', true);
                resetUpgrade();
                return;
            }

            let html = `
                <div style="margin-top:10px;font-size:12px;color:#666;">Выбери выход (до ${maxPrice} монет):</div>
                <div style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;">
            `;

            targets.forEach(s => {
                const chance = ((price / s.price_rub) * 0.9 * 100).toFixed(1);
                html += `
                    <button class="btn" style="font-size:11px;padding:6px;" onclick="selectUpgradeOutput(${s.inv_id}, '${s.weapon}', '${s.name}', ${s.price_rub})">
                        ${s.weapon} | ${s.name} — ${s.price_rub} монет (шанс ${chance}%)
                    </button>
                `;
            });

            html += `</div>`;

            document.getElementById('upgrade-content').innerHTML = html;
            document.getElementById('upgrade-input-display').innerHTML = `${weapon} | ${name} <span style="font-size:10px;color:#888;">${price} монет</span>`;
            document.getElementById('upgrade-input-display').className = 'upgrade-slot active';
        }

        function selectUpgradeOutput(inv_id, weapon, name, price) {
            upgradeState.target_skin = { inv_id, weapon, name, price };
            renderUpgrade();
        }

        function resetUpgrade() {
            upgradeState.input_inv_id = null;
            upgradeState.input_skin = null;
            upgradeState.target_skin = null;
            renderUpgrade();
        }

        async function startUpgrade() {
            if (!upgradeState.input_skin || !upgradeState.target_skin) {
                showToast('❌ Выбери вход и выход', true);
                return;
            }

            // Проверяем лимиты на сервере
            try {
                // Сначала проверяем лимиты
                const resp = await fetch('/api/upgrade', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': user_id
                    },
                    body: JSON.stringify({
                        inventory_id: upgradeState.input_inv_id,
                        target_skin_id: upgradeState.target_skin.inv_id
                    })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    showToast('❌ ' + (err.detail || 'Ошибка'), true);
                    return;
                }

                const result = await resp.json();

                // Показываем колесо
                const wheelContainer = document.getElementById('wheel-container');
                const canvas = document.getElementById('wheel-canvas');
                const ctx = canvas.getContext('2d');
                const resultText = document.getElementById('wheel-result');

                wheelContainer.className = 'show';
                resultText.textContent = '';

                const inPrice = upgradeState.input_skin.price;
                const outPrice = upgradeState.target_skin.price;
                const chance = ((inPrice / outPrice) * 0.9 * 100);
                const clampedChance = Math.min(95, Math.max(0.1, chance));

                // Рисуем колесо
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = canvas.width / 2 - 20;

                // Очищаем
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Зелёный сектор (шанс успеха)
                const startAngle = -Math.PI / 2;
                const greenAngle = (clampedChance / 100) * 2 * Math.PI;

                // Рисуем чёрный сектор
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle + greenAngle, startAngle + 2 * Math.PI);
                ctx.closePath();
                ctx.fillStyle = '#0a0a0a';
                ctx.fill();
                ctx.strokeStyle = '#00ff41';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Рисуем зелёный сектор
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, startAngle + greenAngle);
                ctx.closePath();
                ctx.fillStyle = '#00ff41';
                ctx.fill();
                ctx.strokeStyle = '#00ff41';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Обводка круга
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00ff41';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Текст шанса
                ctx.fillStyle = '#00ff41';
                ctx.font = 'bold 28px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Math.round(clampedChance) + '%', centerX, centerY - 10);

                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('шанс', centerX, centerY + 24);

                // Стрелка (рисуем сверху)
                ctx.beginPath();
                ctx.moveTo(centerX, 15);
                ctx.lineTo(centerX - 18, 30);
                ctx.lineTo(centerX + 18, 30);
                ctx.closePath();
                ctx.fillStyle = '#ff0040';
                ctx.fill();
                ctx.strokeStyle = '#ff0040';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Анимация вращения стрелки
                let angle = 0;
                const duration = 4000; // 4 секунды
                const startTime = Date.now();

                // Результат предопределён
                const isWin = result.result === 'win';

                function animateWheel() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Замедление
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const currentAngle = eased * 6 * 2 * Math.PI;

                    // Очищаем и перерисовываем колесо (без стрелки)
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Чёрный сектор
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle + greenAngle, startAngle + 2 * Math.PI);
                    ctx.closePath();
                    ctx.fillStyle = '#0a0a0a';
                    ctx.fill();
                    ctx.strokeStyle = '#00ff41';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Зелёный сектор
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, startAngle + greenAngle);
                    ctx.closePath();
                    ctx.fillStyle = '#00ff41';
                    ctx.fill();
                    ctx.strokeStyle = '#00ff41';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Обводка
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#00ff41';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Текст шанса
                    ctx.fillStyle = '#00ff41';
                    ctx.font = 'bold 28px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(Math.round(clampedChance) + '%', centerX, centerY - 10);

                    ctx.fillStyle = '#888';
                    ctx.font = '12px monospace';
                    ctx.fillText('шанс', centerX, centerY + 24);

                    // Стрелка (вращается)
                    const arrowAngle = currentAngle;
                    const arrowX = centerX + Math.sin(arrowAngle) * 20;
                    const arrowY = centerY - Math.cos(arrowAngle) * 20;

                    ctx.save();
                    ctx.translate(arrowX, arrowY);
                    ctx.rotate(arrowAngle);

                    ctx.beginPath();
                    ctx.moveTo(0, -25);
                    ctx.lineTo(-12, -5);
                    ctx.lineTo(12, -5);
                    ctx.closePath();
                    ctx.fillStyle = '#ff0040';
                    ctx.fill();
                    ctx.strokeStyle = '#ff0040';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.restore();

                    // Маленький центр
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#00ff41';
                    ctx.fill();

                    if (progress < 1) {
                        requestAnimationFrame(animateWheel);
                    } else {
                        // Показываем результат
                        if (isWin) {
                            resultText.textContent = '✅ УСПЕХ! +' + upgradeState.target_skin.name;
                            resultText.className = 'wheel-result win';
                            // Добавляем золотое свечение
                            document.getElementById('wheel-container').style.boxShadow = '0 0 100px rgba(0, 255, 65, 0.2)';
                        } else {
                            resultText.textContent = '❌ ПРОВАЛ! Скин сгорел';
                            resultText.className = 'wheel-result lose';
                            document.getElementById('wheel-container').style.boxShadow = '0 0 100px rgba(255, 0, 64, 0.2)';
                        }

                        // Обновляем баланс и инвентарь
                        setTimeout(async () => {
                            await loadUserData();
                            resetUpgrade();
                            document.getElementById('wheel-container').style.boxShadow = '';
                        }, 2000);
                    }
                }

                animateWheel();

            } catch (e) {
                showToast('❌ Ошибка соединения', true);
            }
        }

        // ==================== УВЕДОМЛЕНИЯ ====================
        function showToast(text, isError = false) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.textContent = text;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==================== МЕНЮ ====================
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + page).classList.add('active');

                if (page === 'upgrade') {
                    renderUpgrade();
                }
                if (page === 'profile') {
                    renderProfile();
                }
                if (page === 'top') {
                    loadTop();
                }
                if (page === 'subscribe') {
                    loadSubscribeStatus();
                }
                if (page === 'inventory') {
                    loadInventory();
                }
            });
        });

        // ==================== ЗАПУСК ====================
        document.addEventListener('DOMContentLoaded', () => {
            auth();

            // Для локальной разработки (если нет Telegram)
            if (!window.Telegram) {
                console.log('🔧 Локальный режим');
            }
        });

        // ==================== ДЛЯ WEBVIEW ====================
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        console.log('⬡ ARZDROP Web App loaded');
    </script>
