<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARZDROP</title>
    <style>
        /* ===== КИСЛОТНЫЙ СТИЛЬ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app {
            max-width: 480px;
            width: 100%;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 20px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.1);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #00ff41;
            text-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
            letter-spacing: 2px;
        }

        .balance {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 600;
        }

        /* ===== МЕНЮ ===== */
        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: rgba(0, 255, 65, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-radius: 10px;
            padding: 12px 4px;
            text-align: center;
            color: #00ff41;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-btn .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        .menu-btn:hover {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.05);
        }

        .menu-btn.active {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.08);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.05);
        }

        /* ===== СТРАНИЦЫ ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== КАРТОЧКИ ===== */
        .card {
            background: rgba(0, 255, 65, 0.02);
            border: 1px solid rgba(0, 255, 65, 0.08);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #00ff41;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* ===== КЕЙСЫ ===== */
        .case-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(0, 255, 65, 0.02);
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(0, 255, 65, 0.05);
            transition: all 0.2s;
        }

        .case-item:hover {
            border-color: rgba(0, 255, 65, 0.15);
        }

        .case-info .name {
            font-weight: 600;
            font-size: 15px;
        }

        .case-info .price {
            font-size: 12px;
            color: rgba(0, 255, 65, 0.5);
        }

        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.15);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== ИНВЕНТАРЬ ===== */
        .inv-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
            font-size: 14px;
        }

        .inv-item .weapon {
            font-weight: 600;
        }

        .inv-item .price {
            color: rgba(0, 255, 65, 0.5);
            font-size: 13px;
        }

        /* ===== ПРОФИЛЬ ===== */
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
            font-size: 14px;
        }

        .profile-row .label {
            color: rgba(0, 255, 65, 0.5);
        }

        .profile-row .value {
            font-weight: 600;
        }

        /* ===== ТОП ===== */
        .top-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
            font-size: 14px;
        }

        .top-item .place {
            font-weight: 700;
            min-width: 30px;
            color: rgba(0, 255, 65, 0.3);
        }

        .top-item .place.gold { color: #ffd700; }
        .top-item .place.silver { color: #c0c0c0; }
        .top-item .place.bronze { color: #cd7f32; }

        .top-item .name { flex: 1; }

        /* ===== ЗАГРУЗКА ===== */
        .loading {
            color: rgba(0, 255, 65, 0.3);
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        /* ===== АПГРЕЙД ===== */
        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin: 12px 0;
        }

        .upgrade-slot {
            background: rgba(0, 255, 65, 0.02);
            border: 2px dashed rgba(0, 255, 65, 0.1);
            border-radius: 10px;
            padding: 16px 8px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            transition: all 0.3s;
        }

        .upgrade-slot.active {
            border-color: #00ff41;
            border-style: solid;
            background: rgba(0, 255, 65, 0.05);
        }

        .upgrade-slot .title {
            color: rgba(0, 255, 65, 0.3);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upgrade-slot .skin {
            font-weight: 600;
            font-size: 13px;
        }

        .upgrade-slot .price {
            color: rgba(0, 255, 65, 0.4);
            font-size: 11px;
        }

        /* ===== ВСПЛЫВАЮЩИЕ ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            animation: toastIn 0.3s ease;
        }

        .toast.error {
            border-color: #ff0040;
            color: #ff0040;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 400px) {
            .menu { grid-template-columns: repeat(3, 1fr); gap: 4px; }
            .menu-btn { font-size: 9px; padding: 8px 2px; }
            .menu-btn .icon { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">⬡ ARZDROP</div>
        <div class="balance">💰 <span id="balance">0</span></div>
    </div>

    <!-- МЕНЮ -->
    <div class="menu">
        <div class="menu-btn active" data-page="cases"><span class="icon">🎁</span>Кейсы</div>
        <div class="menu-btn" data-page="inventory"><span class="icon">📦</span>Инвентарь</div>
        <div class="menu-btn" data-page="profile"><span class="icon">👤</span>Профиль</div>
        <div class="menu-btn" data-page="upgrade"><span class="icon">🔄</span>Апгрейд</div>
        <div class="menu-btn" data-page="top"><span class="icon">🏆</span>Топ</div>
        <div class="menu-btn" data-page="subscribe"><span class="icon">📢</span>Подписки</div>
    </div>

    <!-- СТРАНИЦЫ -->
    <div id="page-cases" class="page active">
        <div class="card">
            <div class="card-title">🎁 Кейсы</div>
            <div id="cases-list"><div class="loading">Загрузка...</div></div>
        </div>
    </div>

    <div id="page-inventory" class="page">
        <div class="card">
            <div class="card-title">📦 Инвентарь</div>
            <div id="inventory-list"><div class="loading">Загрузка...</div></div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="card">
            <div class="card-title">👤 Профиль</div>
            <div id="profile-content"><div class="loading">Загрузка...</div></div>
        </div>
    </div>

    <div id="page-upgrade" class="page">
        <div class="card">
            <div class="card-title">🔄 Апгрейд</div>
            <div id="upgrade-content">
                <div class="loading">Выбери скин из инвентаря</div>
            </div>
        </div>
    </div>

    <div id="page-top" class="page">
        <div class="card">
            <div class="card-title">🏆 Топ игроков</div>
            <div id="top-players"><div class="loading">Загрузка...</div></div>
        </div>
        <div class="card">
            <div class="card-title">🏆 Топ кланов</div>
            <div id="top-clans"><div class="loading">Загрузка...</div></div>
        </div>
    </div>

    <div id="page-subscribe" class="page">
        <div class="card">
            <div class="card-title">📢 Бонус за подписку</div>
            <div id="subscribe-content"><div class="loading">Загрузка...</div></div>
        </div>
    </div>
</div>

<script>
// ==================== КОНФИГ ====================
const API = window.location.origin;
let user_id = null;
let balance = 0;
let inventory = [];

// ==================== ТЕЛЕГРАМ АВТОРИЗАЦИЯ ====================
function getTelegramUser() {
    if (window.Telegram?.WebApp?.initData) {
        return window.Telegram.WebApp.initData;
    }
    return null;
}

async function auth() {
    const initData = getTelegramUser();
    if (!initData) {
        // Для локальной разработки
        const id = prompt('Введи свой Telegram ID (для разработки):');
        if (id) {
            user_id = parseInt(id);
            await loadAll();
        }
        return;
    }

    try {
        const resp = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ init_data: initData })
        });
        const data = await resp.json();
        if (data.user_id) {
            user_id = data.user_id;
            await loadAll();
        } else {
            showToast('❌ Ошибка авторизации', true);
        }
    } catch (e) {
        showToast('❌ Ошибка соединения', true);
    }
}

// ==================== ЗАГРУЗКА ДАННЫХ ====================
async function loadAll() {
    await Promise.all([
        loadProfile(),
        loadInventory(),
        loadCases(),
        loadTop(),
        loadSubscribe()
    ]);
}

async function loadProfile() {
    try {
        const resp = await fetch(`/api/profile/${user_id}`);
        const user = await resp.json();
        balance = user.balance || 0;
        document.getElementById('balance').textContent = balance;
        
        document.getElementById('profile-content').innerHTML = `
            <div class="profile-row"><span class="label">ID</span><span class="value">${user_id}</span></div>
            <div class="profile-row"><span class="label">Имя</span><span class="value">${user.first_name || 'User'}</span></div>
            <div class="profile-row"><span class="label">Баланс</span><span class="value">${balance} монет</span></div>
            <div class="profile-row"><span class="label">Скинов</span><span class="value">${inventory.length}</span></div>
            <div class="profile-row"><span class="label">Открыто кейсов</span><span class="value">${user.total_opened || 0}</span></div>
            <div class="profile-row"><span class="label">XP</span><span class="value">${user.xp || 0}</span></div>
            <div class="profile-row"><span class="label">Стрейк</span><span class="value">${user.daily_streak || 0} дней</span></div>
        `;
    } catch (e) {
        document.getElementById('profile-content').innerHTML = '<div class="loading">❌ Ошибка</div>';
    }
}

async function loadInventory() {
    try {
        const resp = await fetch(`/api/inventory/${user_id}`);
        inventory = await resp.json();
        
        const container = document.getElementById('inventory-list');
        if (!inventory.length) {
            container.innerHTML = '<div style="text-align:center;color:rgba(0,255,65,0.3);padding:20px;">Инвентарь пуст</div>';
            return;
        }
        container.innerHTML = inventory.map(s => `
            <div class="inv-item">
                <span class="weapon">${s.weapon} | ${s.name}</span>
                <span class="price">${s.price_rub} монет</span>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('inventory-list').innerHTML = '<div class="loading">❌ Ошибка</div>';
    }
}

async function loadCases() {
    // Временно статично
    const cases = [
        { name: 'БОМЖ', price: 500, desc: 'Для бедных' },
        { name: 'DOLLAR', price: 1500, desc: 'Для богатых' }
    ];
    document.getElementById('cases-list').innerHTML = cases.map(c => `
        <div class="case-item">
            <div class="case-info">
                <div class="name">📦 ${c.name}</div>
                <div class="price">${c.price} монет • ${c.desc}</div>
            </div>
            <button class="btn" onclick="openCase('${c.name}')">Открыть</button>
        </div>
    `).join('');
}

async function loadTop() {
    try {
        const [players, clans] = await Promise.all([
            fetch('/api/top_players').then(r => r.json()),
            fetch('/api/top_clans').then(r => r.json())
        ]);
        
        const medals = ['🥇', '🥈', '🥉'];
        const container1 = document.getElementById('top-players');
        if (!players.length) {
            container1.innerHTML = '<div style="text-align:center;color:rgba(0,255,65,0.3);padding:20px;">Нет игроков</div>';
        } else {
            container1.innerHTML = players.map((p, i) => `
                <div class="top-item">
                    <span class="place ${i < 3 ? ['gold','silver','bronze'][i] : ''}">${medals[i] || '#'+(i+1)}</span>
                    <span class="name">${p.name || 'User'}</span>
                    <span>💰 ${p.balance}</span>
                </div>
            `).join('');
        }
        
        const container2 = document.getElementById('top-clans');
        if (!clans.length) {
            container2.innerHTML = '<div style="text-align:center;color:rgba(0,255,65,0.3);padding:20px;">Нет кланов</div>';
        } else {
            container2.innerHTML = clans.map((c, i) => `
                <div class="top-item">
                    <span class="place ${i < 3 ? ['gold','silver','bronze'][i] : ''}">${medals[i] || '#'+(i+1)}</span>
                    <span class="name">${c.name} [${c.tag}]</span>
                    <span>👥 ${c.members}</span>
                </div>
            `).join('');
        }
    } catch (e) {
        document.getElementById('top-players').innerHTML = '<div class="loading">❌ Ошибка</div>';
        document.getElementById('top-clans').innerHTML = '<div class="loading">❌ Ошибка</div>';
    }
}

function loadSubscribe() {
    document.getElementById('subscribe-content').innerHTML = `
        <div style="padding:4px 0;border-bottom:1px solid rgba(0,255,65,0.05);display:flex;justify-content:space-between;">
            <span>🔗 ARZDROP CS2</span>
            <span style="color:rgba(0,255,65,0.3);">❌ не подписан</span>
        </div>
        <div style="padding:4px 0;border-bottom:1px solid rgba(0,255,65,0.05);display:flex;justify-content:space-between;">
            <span>🔗 ARTStudio</span>
            <span style="color:rgba(0,255,65,0.3);">❌ не подписан</span>
        </div>
        <button class="btn" style="margin-top:12px;width:100%;" onclick="showToast('🔄 Проверка подписки...')">Проверить</button>
    `;
}

// ==================== ОТКРЫТИЕ КЕЙСА ====================
async function openCase(caseName) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '⏳...';

    try {
        const resp = await fetch('/api/open_case', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-User-ID': user_id
            },
            body: JSON.stringify({ case_name: caseName })
        });

        if (!resp.ok) {
            const err = await resp.json();
            showToast('❌ ' + (err.detail || 'Ошибка'), true);
            btn.disabled = false;
            btn.textContent = 'Открыть';
            return;
        }

        const result = await resp.json();
        showToast(`🎉 ${result.weapon} | ${result.name} — ${result.price_rub} монет!`);
        
        // Обновляем баланс и инвентарь
        await loadAll();
        btn.disabled = false;
        btn.textContent = 'Открыть';
    } catch (e) {
        showToast('❌ Ошибка соединения', true);
        btn.disabled = false;
        btn.textContent = 'Открыть';
    }
}

// ==================== АПГРЕЙД ====================
async function upgradeInit() {
    if (inventory.length === 0) {
        document.getElementById('upgrade-content').innerHTML = `
            <div style="text-align:center;color:rgba(0,255,65,0.3);padding:20px;">Нет скинов для апгрейда</div>
            <button class="btn" style="width:100%;" onclick="showToast('Открой кейс!')">Открыть кейс</button>
        `;
        return;
    }

    const eligible = inventory.filter(s => s.price_rub >= 1000);
    if (eligible.length === 0) {
        document.getElementById('upgrade-content').innerHTML = `
            <div style="text-align:center;color:rgba(0,255,65,0.3);padding:20px;">Нет скинов ≥ 1000 монет</div>
        `;
        return;
    }

    let html = '<div style="margin-bottom:8px;font-size:13px;color:rgba(0,255,65,0.4);">Выбери вход (≥ 1000 монет):</div>';
    eligible.slice(0, 8).forEach(s => {
        html += `
            <button class="btn" style="font-size:12px;padding:8px;margin-bottom:4px;" onclick="selectUpgrade(${s.inv_id}, ${s.price_rub})">
                ${s.weapon} | ${s.name} — ${s.price_rub} монет
            </button>
        `;
    });
    document.getElementById('upgrade-content').innerHTML = html;
}

function selectUpgrade(inv_id, price) {
    const maxPrice = price * 8;
    const targets = inventory.filter(s => s.price_rub > price && s.price_rub <= maxPrice);
    
    if (targets.length === 0) {
        showToast('❌ Нет подходящих целей', true);
        return;
    }

    let html = `<div style="margin:8px 0;font-size:13px;color:rgba(0,255,65,0.4);">⬆ Вход: ${price} монет</div>`;
    html += '<div style="font-size:13px;color:rgba(0,255,65,0.4);">Выбери выход (до ' + maxPrice + ' монет):</div>';
    
    targets.slice(0, 8).forEach(s => {
        const chance = ((price / s.price_rub) * 0.9 * 100).toFixed(1);
        html += `
            <button class="btn" style="font-size:11px;padding:6px;margin-bottom:4px;" onclick="doUpgrade(${inv_id}, ${s.inv_id})">
                ${s.weapon} | ${s.name} — ${s.price_rub} (шанс ${chance}%)
            </button>
        `;
    });
    html += `<button class="btn" style="font-size:11px;opacity:0.3;margin-top:4px;" onclick="upgradeInit()">↩ Назад</button>`;
    document.getElementById('upgrade-content').innerHTML = html;
}

async function doUpgrade(inv_id, target_inv_id) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '⏳...';

    try {
        const resp = await fetch('/api/upgrade', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-User-ID': user_id
            },
            body: JSON.stringify({ inventory_id: inv_id, target_skin_id: target_inv_id })
        });

        if (!resp.ok) {
            const err = await resp.json();
            showToast('❌ ' + (err.detail || 'Ошибка'), true);
            btn.disabled = false;
            btn.textContent = '➡ Апгрейд';
            return;
        }

        const result = await resp.json();
        if (result.result === 'win') {
            showToast(`✅ УСПЕХ! Ты получил ${result.skin.weapon} | ${result.skin.name}!`);
        } else {
            showToast(`❌ ПРОВАЛ! Скин сгорел.`);
        }
        
        await loadAll();
        upgradeInit();
    } catch (e) {
        showToast('❌ Ошибка соединения', true);
        btn.disabled = false;
        btn.textContent = '➡ Апгрейд';
    }
}

// ==================== УВЕДОМЛЕНИЯ ====================
function showToast(text, isError = false) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.textContent = text;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

// ==================== МЕНЮ ====================
document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const page = btn.dataset.page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');

        if (page === 'upgrade') upgradeInit();
        if (page === 'profile') loadProfile();
        if (page === 'inventory') loadInventory();
        if (page === 'top') loadTop();
    });
});

// ==================== ЗАПУСК ====================
document.addEventListener('DOMContentLoaded', () => {
    auth();
});

if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}
</script>
</body>
